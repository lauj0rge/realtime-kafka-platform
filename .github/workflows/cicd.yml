name: Data Platform CI/CD

on:
  push:
    branches:
      - dev
      - prod

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4


  deploy:
    runs-on: ubuntu-latest
    env:
      ENV: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Deploy
        run: |
          cd infrastructure
          ls 
          pwd
          terraform init -upgrade
          terraform apply -auto-approve -var-file=env/${ENV}.tfvars    

  test:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      ENV: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make test ENV=$ENV

  cleanup:
    runs-on: ubuntu-latest
    needs: test
    env:
      ENV: ${{ github.ref_name }}
    steps:
      - name: Cleanup
        run: k3d cluster delete data-platform-$ENV --yes


name: Data Platform CI/CD

on:
  push:
    branches:
      - dev
      - prod

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  build:
    runs-on: ubuntu-latest
    needs: checkout
    env:
      ENV: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make build ENV=$ENV

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      ENV: ${{ github.ref_name }}
      TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Deploy
        run: make deploy ENV=$ENV

  test:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      ENV: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make test ENV=$ENV

  cleanup:
    runs-on: ubuntu-latest
    needs: test
    env:
      ENV: ${{ github.ref_name }}
    steps:
      - name: Cleanup
        run: make clean ENV=$ENV

